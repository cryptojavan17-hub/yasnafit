<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سشن‌های معاملاتی</title>
<style>
  :root{
    --card-bg-1:#161a2e;
    --card-bg-2:#111426;
    --page-bg:#0a0c18;
    --text:#eef1fa;
    --muted:#8e95ad;
    --line:rgba(255,255,255,.075);
    --track:rgba(255,255,255,.1);
    --green:#3ddc84;
    --green-soft:rgba(61,220,132,.16);
    --amber:#f5b64e;
    --radius:18px;
    --mono:"JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:var(--page-bg);
    color:var(--text);
    font-family:Vazirmatn,"Segoe UI",Tahoma,"Iranian Sans",system-ui,sans-serif;
    display:grid;
    place-items:center;
    padding:18px;
  }
  /* embed mode: drop this file into any dashboard with ?embed=1 */
  body[data-embed="1"]{background:transparent;display:block;padding:0;min-height:0}
  body[data-embed="1"] .sessions-card{width:100%}

  .sessions-card{
    width:min(360px,100%);
    background:linear-gradient(160deg,var(--card-bg-1),var(--card-bg-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 18px 44px rgba(0,0,0,.45);
    padding:14px 16px 16px;
  }
  .sessions-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .sessions-title{font-size:13px;font-weight:700;color:var(--text)}
  .sessions-clock{display:flex;align-items:baseline;gap:5px;direction:ltr}
  .sessions-clock svg{width:14px;height:14px;color:var(--muted);align-self:center}
  .sessions-clock b{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.4px;font-variant-numeric:tabular-nums}
  .sessions-clock span{font-size:9px;color:var(--muted);letter-spacing:1px}

  .session-row{padding:9px 0 10px;border-bottom:1px solid var(--line)}
  .session-row:last-child{border-bottom:none;padding-bottom:2px}
  .session-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .session-city{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
  .session-dot{width:7px;height:7px;border-radius:50%;background:var(--track);flex:0 0 auto}
  .session-row[data-open="1"] .session-dot{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
  .session-state{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .session-row[data-open="1"] .session-state{color:var(--green);font-weight:800}
  .session-row[data-soon="1"]:not([data-open="1"]) .session-state{color:var(--amber)}
  .session-bar{height:3px;border-radius:999px;background:var(--track);margin-top:8px;overflow:hidden}
  .session-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--green);transition:width .4s linear}
  .sessions-foot{margin-top:10px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>
<body>
  <section class="sessions-card" id="sessionsCard" aria-label="سشن‌های معاملاتی">
    <header class="sessions-head">
      <h1 class="sessions-title">سشن‌های معاملاتی</h1>
      <div class="sessions-clock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
        </svg>
        <b id="utcClock">--:--:--</b><span>UTC</span>
      </div>
    </header>
    <div id="sessionsList"></div>
    <p class="sessions-foot" id="sessionsFoot"></p>
  </section>

<script>
/* Edit the sessions here. open/close are LOCAL wall-clock times, so daylight saving
   is handled automatically from the IANA time zone — no manual UTC shifting. */
const SESSIONS=[
  {name:'سیدنی',   tz:'Australia/Sydney', open:'08:00', close:'16:00'},
  {name:'توکیو',   tz:'Asia/Tokyo',       open:'09:00', close:'17:00'},
  {name:'لندن',    tz:'Europe/London',    open:'08:00', close:'16:30'},
  {name:'نیویورک', tz:'America/New_York', open:'09:00', close:'17:00'}
];

const FA_DIGITS='۰۱۲۳۴۵۶۷۸۹';
const toFa=value=>String(value).replace(/\d/g,digit=>FA_DIGITS[digit]);
const minutesOf=time=>{const [h,m]=String(time).split(':').map(Number);return h*60+m;};

function zoneParts(epoch,tz){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(epoch));
  const value=Object.fromEntries(parts.map(part=>[part.type,part.value]));
  return {year:+value.year,month:+value.month,day:+value.day,hour:+value.hour,minute:+value.minute,second:+value.second};
}
function zoneOffsetMinutes(epoch,tz){
  const p=zoneParts(epoch,tz);
  return Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-epoch)/60000);
}
/* local wall time in a zone -> epoch (ms), DST safe */
function localToEpoch(tz,year,month,day,hour,minute){
  const guess=Date.UTC(year,month-1,day,hour,minute);
  let epoch=guess-zoneOffsetMinutes(guess,tz)*60000;
  const again=zoneOffsetMinutes(epoch,tz);
  if(again!==zoneOffsetMinutes(guess,tz))epoch=guess-again*60000;
  return epoch;
}
function zoneClock(epoch,tz){
  const p=zoneParts(epoch,tz);
  return `${String(p.hour).padStart(2,'0')}:${String(p.minute).padStart(2,'0')}`;
}
/* one session row: open now? minutes until open? progress through the session */
function sessionStatus(session,now){
  const local=zoneParts(now,session.tz);
  const localMinutes=local.hour*60+local.minute+local.second/60;
  const open=minutesOf(session.open),close=minutesOf(session.close);
  const dayOf=date=>zoneParts(date,session.tz);
  const atTime=(date,hour,minute)=>{const p=dayOf(date);return localToEpoch(session.tz,p.year,p.month,p.day,hour,minute);};
  if(localMinutes>=open&&localMinutes<close){
    const startedAt=atTime(now,Math.floor(open/60),open%60);
    const endsAt=atTime(now,Math.floor(close/60),close%60);
    const total=endsAt-startedAt;
    return {open:true,progress:total>0?Math.min(1,Math.max(0,(now-startedAt)/total)):0,endsInMinutes:Math.max(0,Math.round((endsAt-now)/60000)),startsAt:null,localTime:zoneClock(now,session.tz)};
  }
  const candidates=[
    localMinutes<open?atTime(now,Math.floor(open/60),open%60):null,
    localToEpoch(session.tz,local.month===12?local.year+1:local.year,local.month===12?1:local.month,local.month===12?local.day:local.day+1,Math.floor(open/60),open%60)
  ].filter(Boolean);
  const next=candidates.filter(epoch=>epoch>now).sort((a,b)=>a-b)[0]||candidates.sort((a,b)=>a-b)[0];
  const before=dayOf(next);
  return {open:false,progress:0,endsInMinutes:0,startsAt:next,localTime:zoneClock(now,session.tz),opensLocal:`${String(Math.floor(open/60)).padStart(2,'0')}:${String(open%60).padStart(2,'0')}–${String(Math.floor(close/60)).padStart(2,'0')}:${String(close%60).padStart(2,'0')} ${before.year}/${before.month}/${before.day}`};
}
function humanUntil(minutes){
  if(minutes<60)return `${toFa(minutes)} دقیقه تا باز شدن`;
  const hours=Math.floor(minutes/60);
  return hours<24?`${toFa(hours)} ساعت تا باز شدن`:`${toFa(Math.floor(hours/24))} روز تا باز شدن`;
}
function render(){
  const now=Date.now();
  const list=document.getElementById('sessionsList');
  list.innerHTML=SESSIONS.map(session=>{
    const status=sessionStatus(session,now);
    const minutesUntil=status.open?0:Math.max(1,Math.round((status.startsAt-now)/60000));
    const state=status.open?'باز':humanUntil(minutesUntil);
    const soon=!status.open&&minutesUntil<=90?' data-soon="1"':'';
    const hint=status.open
      ? `${session.name} — باز است تا ${toFa(status.endsInMinutes)} دقیقه دیگر (ساعت محلی ${status.localTime})`
      : `${session.name} — باز شدن محلی ${status.opensLocal}`;
    return `<div class="session-row" data-open="${status.open?1:0}"${soon} title="${hint}">
      <div class="session-line">
        <span class="session-city">${session.name}<i class="session-dot"></i></span>
        <span class="session-state">${state}</span>
      </div>
      <div class="session-bar"><i style="width:${status.open?Math.round(status.progress*100):0}%"></i></div>
    </div>`;
  }).join('');
  const clock=new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(now));
  document.getElementById('utcClock').textContent=clock;
  const opened=SESSIONS.filter(session=>sessionStatus(session,now).open).length;
  document.getElementById('sessionsFoot').textContent=`${toFa(opened)} سشن باز — ساعت‌ها به وقت محلی هر شهر، با تغییر ساعت تابستانی`;
}
if(new URLSearchParams(location.search).get('embed')==='1')document.body.dataset.embed='1';
render();
setInterval(render,1000);
</script>
</body>
</html>
