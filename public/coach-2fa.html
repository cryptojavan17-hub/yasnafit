<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تأیید هویت | Yasnafit</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/coach-login.css" />
</head>
<body class="coach-login-body">
  <main class="coach-login-shell">
    <section class="coach-login-card" aria-labelledby="coachTotpTitle">
      <div class="coach-login-brand">
        <span class="coach-login-mark" aria-hidden="true">Y</span>
        <div>
          <strong>Yasnafit</strong>
          <span>پنل مربی</span>
        </div>
      </div>
      <h1 id="coachTotpTitle">تأیید هویت</h1>
      <p class="coach-login-lead">کد ۶ رقمی Google Authenticator را وارد کنید.</p>
      <form id="coachTotpForm" autocomplete="off">
        <label class="coach-login-field">
          <span>کد ۶ رقمی</span>
          <input id="coachTotpCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required maxlength="6" pattern="[0-9۰-۹٠-٩]{6}" placeholder="••••••" />
        </label>
        <button class="coach-login-submit" type="submit" id="coachTotpSubmit">ورود به پنل</button>
      </form>
      <p class="coach-login-error" id="coachLoginError" role="alert" hidden></p>
    </section>
  </main>
  <script src="/coach-login.js"></script>
</body>
</html>
