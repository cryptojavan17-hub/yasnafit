<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود مربی | Yasnafit</title>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/coach-login.css" />
</head>
<body class="coach-login-body">
  <main class="coach-login-shell">
    <section class="coach-login-card" aria-labelledby="coachLoginTitle">
      <div class="coach-login-brand">
        <span class="coach-login-mark" aria-hidden="true">Y</span>
        <div>
          <strong>Yasnafit</strong>
          <span>پنل مربی</span>
        </div>
      </div>
      <h1 id="coachLoginTitle">ورود مربی</h1>
      <p class="coach-login-lead" id="coachLoginLead">ایمیل و رمز عبور خود را وارد کنید.</p>

      <form id="coachPasswordForm" autocomplete="on">
        <label class="coach-login-field">
          <span>ایمیل</span>
          <input id="coachEmail" name="email" type="email" inputmode="email" autocomplete="username" required maxlength="254" placeholder="coach@example.com" />
        </label>
        <label class="coach-login-field">
          <span>رمز عبور</span>
          <input id="coachPassword" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" />
        </label>
        <p class="coach-login-hint">رمز باید حداقل ۸ کاراکتر و شامل حرف و عدد باشد.</p>
        <button class="coach-login-submit" type="submit" id="coachPasswordSubmit">ادامه</button>
      </form>

      <form id="coachOtpForm" hidden>
        <label class="coach-login-field">
          <span>کد ۶ رقمی ایمیل</span>
          <input id="coachOtp" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required maxlength="6" pattern="[0-9۰-۹٠-٩]{6}" placeholder="••••••" />
        </label>
        <p class="coach-login-hint" id="coachOtpHint">کد تأیید به ایمیل مربی ارسال شد.</p>
        <button class="coach-login-submit" type="submit" id="coachOtpSubmit">ورود به پنل</button>
        <button class="coach-login-secondary" type="button" id="coachOtpBack">بازگشت</button>
      </form>

      <p class="coach-login-error" id="coachLoginError" role="alert" hidden></p>
    </section>
  </main>
  <script src="/coach-login.js"></script>
</body>
</html>
