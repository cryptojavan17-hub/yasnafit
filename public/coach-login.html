<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ورود مربی | Yasnafit</title>
  <script src="/theme-toggle.js"></script>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/coach-login.css" />
</head>
<body class="coach-login-body">
  <main class="coach-login-shell">
    <section class="coach-login-card" aria-labelledby="coachLoginTitle">
      <div class="coach-login-brand">
        <span class="coach-login-mark" aria-hidden="true">Y</span>
        <div>
          <strong>Yasnafit</strong>
          <span>پنل مربی</span>
        </div>
      </div>
      <h1 id="coachLoginTitle">ورود مربی</h1>
      <p class="coach-login-lead">ایمیل و رمز عبور خود را وارد کنید.</p>
      <form id="coachPasswordForm" autocomplete="on">
        <label class="coach-login-field">
          <span>ایمیل مربی</span>
          <input id="coachEmail" name="email" type="email" inputmode="email" autocomplete="username" required maxlength="254" />
        </label>
        <label class="coach-login-field">
          <span>رمز عبور</span>
          <input id="coachPassword" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" />
        </label>
        <button class="coach-login-submit" type="submit" id="coachPasswordSubmit">ادامه</button>
      </form>
      <p class="coach-login-error" id="coachLoginError" role="alert" hidden></p>
    </section>
  </main>
  <script src="/coach-login.js"></script>
  <button class="theme-toggle theme-toggle-float" id="themeToggle" type="button" data-theme-toggle title="تغییر تم روشن/تاریک" aria-label="تغییر تم روشن/تاریک" aria-pressed="false"><svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.1 5.1l1.5 1.5M17.4 17.4l1.5 1.5M18.9 5.1l-1.5 1.5M6.6 17.4l-1.5 1.5"/></svg><svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 13.4A8.4 8.4 0 0 1 10.6 3.8 8.4 8.4 0 1 0 20.2 13.4Z"/></svg></button>
</body>
</html>
