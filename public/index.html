<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yasnafit | پنل مربی</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/dark-theme.css" />
  <link rel="stylesheet" href="/exercises.css" />
  <link rel="stylesheet" href="/program-builder.css" />
  <link rel="stylesheet" href="/student-portal.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">Y</div><div><strong>Yasnafit</strong><span>پنل مدیریت مربی</span></div></div>
      <div class="sidebar-title">منوی اصلی</div>
      <nav id="menu" aria-label="منوی اصلی"></nav>
      <div class="sidebar-footer"><span class="online-dot"></span> سامانه محلی آماده است</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuToggle" aria-label="باز کردن منو">☰</button>
        <div class="breadcrumb"><span>Yasnafit</span><b>/</b><strong id="breadcrumb">داشبورد</strong></div>
        <div class="top-actions"><button class="icon-button" title="تیکت‌ها">?</button><button class="avatar" title="حساب مدیر">م</button></div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <script src="/app.js"></script>
  <script src="/core.js"></script>
  <script src="/exercises.js"></script>
  <script src="/program-builder.js"></script>
  <script src="/student-portal.js"></script>
  <script src="/coach-submissions.js"></script>
  <script>
    // Feature modules load after the shell. Re-dispatch the real deep link only
    // after student portal, submissions, and Program Builder renderers exist.
    if (location.pathname.startsWith('/join/') && window.renderStudentPortal) {
      window.renderStudentPortal(location.pathname);
    } else if (location.pathname !== '/' && window.onpopstate) {
      window.dispatchEvent(new PopStateEvent('popstate'));
    }
  </script>
</body>
</html>
